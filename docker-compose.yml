services:
  caddy:
    build:
      context: ./caddy
      dockerfile: Dockerfile
    container_name: openedge-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - ACME_EMAIL=${ACME_EMAIL:-admin@example.com}
      - CROWDSEC_BOUNCER_KEY=${CROWDSEC_BOUNCER_KEY:-changeme}
      - CROWDSEC_LAPI_URL=${CROWDSEC_LAPI_URL:-http://crowdsec:8080}
      - DOMAIN=${DOMAIN:-localhost}
      - UPSTREAM=${UPSTREAM:-http://whoami:80}
      - REDIS_ADDR=${REDIS_ADDR:-redis:6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    networks:
      - openedge
    depends_on:
      - whoami
      - crowdsec
      - redis
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    container_name: openedge-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    networks:
      - openedge
    security_opt:
      - no-new-privileges:true

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: openedge-crowdsec
    restart: unless-stopped
    environment:
      - GID=1000
      - COLLECTIONS=crowdsecurity/caddy crowdsecurity/http-cve crowdsecurity/whitelist-good-actors crowdsecurity/appsec-generic-rules
      - BOUNCER_KEY_caddy=${CROWDSEC_BOUNCER_KEY:-changeme}
    volumes:
      - crowdsec_db:/var/lib/crowdsec/data
      - ./crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - caddy_logs:/var/log/caddy:ro
    networks:
      - openedge
    security_opt:
      - no-new-privileges:true

  # Optional bot challenge (enable by setting UPSTREAM=http://anubis:3000)
  anubis:
    image: ghcr.io/techarohq/anubis:latest
    container_name: openedge-anubis
    restart: unless-stopped
    profiles: ["bot-challenge"]
    environment:
      - BIND=:3000
      - TARGET=${ANUBIS_TARGET:-http://whoami:80}
      - DIFFICULTY=${ANUBIS_DIFFICULTY:-4}
      - SERVE_ROBOTS_TXT=true
    networks:
      - openedge
    security_opt:
      - no-new-privileges:true

  whoami:
    image: traefik/whoami:latest
    container_name: openedge-whoami
    restart: unless-stopped
    networks:
      - openedge

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
  crowdsec_db:

networks:
  openedge:
    driver: bridge
